# Reminder shortcuts shown on the bell menu. One per line:
#   Label = when
# Blank lines and lines starting with # are ignored.
#
# when:
#   15m, 90m, 1h, 3h, 2d     that long after you click
#   today 20:00              that clock time today, or tomorrow if it has passed
#   tomorrow 09:00           that clock time tomorrow
#   monday 09:00             the next Monday at 09:00 (today, if it is still ahead)
#
# Weekdays are monday through sunday. Times use 24-hour HH:MM.
# This file is copied next to your notes the first time the app runs.
# Edit that copy. The bell menu picks it up the next time you open it.
#   Linux:   ~/.local/share/app.sdeb.StickyNotes/reminder-shortcuts.conf
#   Windows: %APPDATA%\app.sdeb.StickyNotes\reminder-shortcuts.conf
#   macOS:   ~/Library/Application Support/app.sdeb.StickyNotes/reminder-shortcuts.conf
# Delete the copy to go back to this list.

In 15 minutes = 15m
In 1 hour = 1h
In 3 hours = 3h
Tonight at 20:00 = today 20:00
Tomorrow at 9:00 = tomorrow 09:00
Tomorrow evening = tomorrow 18:00
Next Monday = monday 09:00
